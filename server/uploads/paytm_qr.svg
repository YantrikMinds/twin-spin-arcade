<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="320" height="380">
  <defs>
    <linearGradient id="paytmBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002e6e" />
      <stop offset="100%" stop-color="#00b9f1" />
    </linearGradient>
  </defs>
  <!-- Card Background -->
  <rect width="320" height="380" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Header with Paytm branding styling -->
  <path d="M 0 16 Q 0 0 16 0 L 304 0 Q 320 0 320 16 L 320 60 L 0 60 Z" fill="url(#paytmBlue)"/>
  <text x="160" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">PAYTM / UPI ACCEPTED</text>
  <text x="160" y="50" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#e0f7fe" text-anchor="middle">TWIN SPIN ARCADE CAFE</text>

  <!-- QR Code Mock Pattern -->
  <g transform="translate(45, 80)">
    <!-- QR border frame -->
    <rect width="230" height="230" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Top-Left Corner Box -->
    <rect x="20" y="20" width="45" height="45" rx="4" fill="#0f172a"/>
    <rect x="27" y="27" width="31" height="31" rx="2" fill="#ffffff"/>
    <rect x="34" y="34" width="17" height="17" rx="1" fill="#00b9f1"/>

    <!-- Top-Right Corner Box -->
    <rect x="165" y="20" width="45" height="45" rx="4" fill="#0f172a"/>
    <rect x="172" y="27" width="31" height="31" rx="2" fill="#ffffff"/>
    <rect x="179" y="34" width="17" height="17" rx="1" fill="#00b9f1"/>

    <!-- Bottom-Left Corner Box -->
    <rect x="20" y="165" width="45" height="45" rx="4" fill="#0f172a"/>
    <rect x="27" y="172" width="31" height="31" rx="2" fill="#ffffff"/>
    <rect x="34" y="179" width="17" height="17" rx="1" fill="#00b9f1"/>

    <!-- QR Data Grid Simulated Blocks -->
    <rect x="80" y="25" width="10" height="35" fill="#1e293b"/>
    <rect x="100" y="20" width="25" height="10" fill="#1e293b"/>
    <rect x="135" y="25" width="15" height="20" fill="#1e293b"/>
    <rect x="110" y="45" width="20" height="15" fill="#1e293b"/>

    <rect x="25" y="80" width="35" height="10" fill="#1e293b"/>
    <rect x="20" y="105" width="15" height="25" fill="#1e293b"/>
    <rect x="45" y="115" width="20" height="15" fill="#1e293b"/>
    <rect x="30" y="140" width="30" height="10" fill="#1e293b"/>

    <rect x="80" y="80" width="70" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <!-- Center Logo Emblem -->
    <circle cx="115" cy="115" r="22" fill="#002e6e"/>
    <text x="115" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#00b9f1" text-anchor="middle">TS</text>

    <rect x="165" y="80" width="40" height="15" fill="#1e293b"/>
    <rect x="180" y="105" width="25" height="20" fill="#1e293b"/>
    <rect x="165" y="135" width="45" height="15" fill="#1e293b"/>

    <rect x="80" y="165" width="25" height="20" fill="#1e293b"/>
    <rect x="115" y="170" width="35" height="15" fill="#1e293b"/>
    <rect x="90" y="195" width="20" height="15" fill="#1e293b"/>
    <rect x="120" y="195" width="40" height="15" fill="#1e293b"/>
    <rect x="175" y="170" width="30" height="35" fill="#1e293b"/>
  </g>

  <!-- Footer Scan Note -->
  <text x="160" y="335" font-family="Arial, sans-serif" font-size="12" font-weight="800" fill="#002e6e" text-anchor="middle">SCAN &amp; PAY USING ANY UPI APP</text>
  <text x="160" y="355" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">GPay • PhonePe • Paytm • BHIM</text>
</svg>
